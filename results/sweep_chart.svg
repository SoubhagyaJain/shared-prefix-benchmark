<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-label="Median TTFT and prompt evaluation time by prefix length">
<rect width="100%" height="100%" fill="white"/>
<style>text{font:14px Arial,sans-serif;fill:#1f2937}.title{font-size:22px;font-weight:bold}.panel{font-size:17px;font-weight:bold}.axis{stroke:#9ca3af;stroke-width:1}.grid{stroke:#e5e7eb;stroke-width:1}</style>
